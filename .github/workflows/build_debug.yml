# Сборка debug-APK Shannon Modem Tweaks без секретов репозитория.
# Куда положить: .github/workflows/build_debug.yml  (в своём форке)
# Debug-сборка подписывается автоматически отладочным ключом — keystore и secrets не нужны.

name: Build debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Необязательно: прогон unit-тестов (можно удалить этот шаг)
      - name: Run unit tests
        run: ./gradlew test --no-daemon || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          if-no-files-found: error
          path: app/build/outputs/apk/debug/*.apk
