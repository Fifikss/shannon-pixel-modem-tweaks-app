# .github/workflows/build_debug.yml — сборка debug-APK Shannon Modem Tweaks.
# Актуальная версия. Что изменилось:
#   • создаётся пустой local.properties — без него Gradle падал на этапе конфигурации
#     (No such file or directory на app/build.gradle.kts:58);
#   • SENTRY_AUTH_TOKEN="" отключает отправку source context в Sentry во время сборки;
#   • убраны 3 повтора — причина падений была не в 429, а в конфигурации.

name: Build debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ГЛАВНОЕ ИСПРАВЛЕНИЕ: пустой local.properties.
      # Он в .gitignore, но app/build.gradle.kts читает его при конфигурации проекта.
      - name: Create empty local.properties
        run: touch local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          SENTRY_AUTH_TOKEN: ""

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          if-no-files-found: error
          path: app/build/outputs/apk/debug/*.apk
